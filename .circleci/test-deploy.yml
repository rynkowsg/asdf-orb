version: 2.1

orbs:
  # orb under test
  asdf: {}
  # changelog: https://github.com/CircleCI-Public/BATS-orb/releases
  bats: circleci/bats@1.1.0
  # orb info: https://circleci.com/developer/orbs/orb/circleci/orb-tools
  # changelog: https://github.com/CircleCI-Public/orb-tools-orb/releases
  orb-tools: circleci/orb-tools@12.5.0

executors:
  # https://circleci.com/developer/images/image/cimg/base
  # https://hub.docker.com/r/cimg/base/tags
  docker_base_medium_arm:
    docker: [{image: 'cimg/base:2026.09-24.04'}]
    resource_class: arm.medium
  docker_base_small_x86:
    docker: [{image: 'cimg/base:2026.09-24.04'}]
    resource_class: small
  # https://circleci.com/developer/machine/image/android
  machine_android_medium_x86:
    machine: {image: 'android:2026.05.1'}
    resource_class: medium
  # https://circleci.com/developer/machine/image/ubuntu-2604
  machine_ubuntu2604_medium_arm:
    machine: {image: 'ubuntu-2604:2026.07.1'}
    resource_class: arm.medium
  machine_ubuntu2604_medium_x86:
    machine: {image: 'ubuntu-2604:2026.07.1'}
    resource_class: medium
  # https://circleci.com/developer/machine/image/xcode
  macos_medium:
    macos: {xcode: '27.0.0'}
    resource_class: m4pro.medium

# Every branch and every tag. Tags have to be named: a job with no tag filter is
# skipped when a tag is pushed, and the publish jobs below require these, so on a
# release tag they would have nothing to wait for.
run_always: &run_always
  branches: {only: '/.*/'}
  tags: {only: '/.*/'}

# Only a release tag, never a branch.
run_on_release: &run_on_release
  branches: {ignore: '/.*/'}
  tags: {only: '/^v[0-9]+\.[0-9]+\.[0-9]+$/'}

jobs:
  # tests installing ASDF on various platforms
  test_install_asdf:
    parameters:
      executor: {type: executor}
    executor: <<parameters.executor>>
    steps:
      - asdf/install_asdf
      - asdf/cache_restore
      - run:
          name: install tools
          command: |
            asdf plugin add jet https://github.com/rynkowsg/asdf-jet.git
            asdf install jet 0.7.27
            asdf global jet 0.7.27
      - asdf/cache_save
      - run:
          name: Check
          command: |
            set -x
            asdf --version
            jet --version

workflows:
  test-deploy:
    jobs:
      - test_install_asdf:
          name: "test_install_asdf; E:<<matrix.executor>>"
          matrix:
            parameters:
              executor:
                - docker_base_medium_arm
                - docker_base_small_x86
                - machine_android_medium_x86
                - machine_ubuntu2604_medium_arm
                - machine_ubuntu2604_medium_x86
                - macos_medium
          filters: *run_always

      - orb-tools/pack:
          requires:
            - test_install_asdf
          filters: *run_always

      - orb-tools/publish:
          name: publish-dev
          orb_name: rynkowsg/asdf
          vcs_type: <<pipeline.project.type>>
          pub_type: dev
          requires:
            - orb-tools/pack
          context: circleci/orb-publishing-context
          filters: *run_always

      - orb-tools/publish:
          name: publish-prod
          orb_name: rynkowsg/asdf
          vcs_type: <<pipeline.project.type>>
          pub_type: production
          requires:
            - publish-dev
          context: circleci/orb-publishing-context
          filters: *run_on_release
